[package]
name = "libmir"
version.workspace = true
edition.workspace = true

license.workspace = true
description = "Native Rust library for local language model inference"
readme = "README.md"
repository.workspace = true

[[test]]
name = "vision"
path = "tests/vision/mod.rs"

[workspace]
members = [
    "core",
    "cuda",
    "metal",
    "models",
    "runtime",
]
default-members = [".", "core", "models", "runtime"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://codeberg.org/mirmir/libmir"

[workspace.dependencies]
async-trait = "0.1"
blake3 = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
minijinja = { version = "2", features = ["builtins", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
mircuda = "0.3.0"
mirtal = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
toml = "0.9"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
cuda = ["dep:cuda"]
metal = ["dep:metal"]

[dependencies]
async-trait.workspace = true
foundation = { package = "libmir-core", version = "0.3.0", path = "core" }
cuda = { package = "libmir-cuda", version = "0.3.0", path = "cuda", optional = true }
metal = { package = "libmir-metal", version = "0.3.0", path = "metal", optional = true }
models = { package = "libmir-models", version = "0.3.0", path = "models" }
runtime = { package = "libmir-runtime", version = "0.3.0", path = "runtime" }
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
image.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
keyword_idents = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

arithmetic_side_effects = "allow"
blanket_clippy_restriction_lints = "allow"
cargo_common_metadata = "allow"
dbg_macro = "deny"
expect_used = "deny"
implicit_return = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
self_named_module_files = "deny"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
